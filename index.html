<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lingo-Pet Cafe</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel to compile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #ffedd5;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        
        #root, #root > div {
            height: 100%;
        }

        .font-cartoon {
            font-family: 'Fredoka One', cursive;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(15deg); }
        }

        @keyframes float-reverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(-15deg); }
        }

        @keyframes bounce-pet {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes steam {
            0% { transform: translateY(0) scale(1) translateX(0); opacity: 0.8; }
            50% { transform: translateY(-30px) scale(1.2) translateX(10px); opacity: 0.4; }
            100% { transform: translateY(-60px) scale(1.5) translateX(-10px); opacity: 0; }
        }

        @keyframes pulse-mic {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 25px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-float-delayed { animation: float-reverse 7s ease-in-out infinite 2s; }
        .animate-bounce-pet { animation: bounce-pet 3s ease-in-out infinite; }
        .animate-steam { animation: steam 2.5s ease-out infinite; }
        .animate-steam-delayed { animation: steam 3s ease-out infinite 1.2s; }
        .animate-pulse-mic { animation: pulse-mic 1.5s infinite; }
        .animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .cafe-pattern {
            background-color: #fde68a;
            background-image: radial-gradient(#fbbf24 2px, transparent 2px);
            background-size: 30px 30px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom SVG Icons (Replacing Lucide dependencies for standalone HTML)
        const MicIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>;
        const PlayIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"/></svg>;
        const CheckCircleIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>;
        const XCircleIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>;
        const StarIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const VolumeIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>;
        const CoffeeLogoIcon = ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></svg>;

        const ITEMS = [
            { id: 'pizza', name: 'pizza', icon: <span className="text-6xl drop-shadow-md">🍕</span> },
            { id: 'burger', name: 'burger', icon: <span className="text-6xl drop-shadow-md">🍔</span> },
            { id: 'coffee', name: 'coffee', icon: <span className="text-6xl drop-shadow-md">☕</span> },
        ];

        const PETS = ['🐶', '🐱', '🐼', '🦊', '🐰'];

        const FloatingBeans = () => (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-0">
                {[...Array(8)].map((_, i) => (
                    <div 
                        key={i} 
                        className={`absolute text-4xl text-amber-800/30 ${i % 2 === 0 ? 'animate-float' : 'animate-float-delayed'}`}
                        style={{
                            left: `${Math.random() * 90}%`,
                            top: `${Math.random() * 90}%`,
                            animationDelay: `${Math.random() * 4}s`
                        }}
                    >
                        ☕
                    </div>
                ))}
            </div>
        );

        function LingoPetCafe() {
            const [gameState, setGameState] = useState('intro');
            const [score, setScore] = useState(0);
            
            const [currentOrder, setCurrentOrder] = useState(ITEMS[0]);
            const [currentPet, setCurrentPet] = useState(PETS[0]);
            const [spokenText, setSpokenText] = useState('');
            const [isListening, setIsListening] = useState(false);
            const [isMuted, setIsMuted] = useState(true);

            const recognitionRef = useRef(null);

            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.continuous = false;
                    recognition.interimResults = true;
                    recognition.lang = 'en-US';

                    recognition.onstart = () => setIsListening(true);
                    recognition.onend = () => setIsListening(false);
                    
                    recognition.onresult = (event) => {
                        const transcript = Array.from(event.results)
                            .map(result => result[0])
                            .map(result => result.transcript)
                            .join('');
                        
                        setSpokenText(transcript);
                        
                        if (event.results[0].isFinal) {
                            checkSpeech(transcript);
                        }
                    };

                    recognitionRef.current = recognition;
                } else {
                    console.warn("Speech Recognition API is not supported in this browser.");
                }

                return () => {
                    if (recognitionRef.current) recognitionRef.current.abort();
                };
            }, [currentOrder, gameState]);

            const toggleListen = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                } else {
                    setSpokenText('');
                    recognitionRef.current?.start();
                }
            };

            const startGame = () => {
                setGameState('playing');
                setScore(0);
                generateNewOrder();
            };

            const generateNewOrder = () => {
                const randomItem = ITEMS[Math.floor(Math.random() * ITEMS.length)];
                const randomPet = PETS[Math.floor(Math.random() * PETS.length)];
                setCurrentOrder(randomItem);
                setCurrentPet(randomPet);
                setSpokenText('');
            };

            const checkSpeech = (speech) => {
                if (gameState !== 'playing') return;

                const normalizedSpeech = speech.toLowerCase().replace(/[.,!]/g, '');
                const targetPhrase = `here is your ${currentOrder.name}`;

                if (normalizedSpeech.includes(targetPhrase)) {
                    setGameState('success');
                    setScore(s => s + 10);
                    setTimeout(() => {
                        generateNewOrder();
                        setGameState('playing');
                    }, 3500);
                } else {
                    setGameState('failure');
                    setTimeout(() => {
                        setSpokenText('');
                        setGameState('playing');
                    }, 3000);
                }
            };

            const renderHeader = () => (
                <header className="flex justify-between items-center p-4 md:p-6 bg-white/80 backdrop-blur-md border-b-8 border-orange-400 shadow-xl z-10 relative">
                    <div className="flex items-center gap-4">
                        <div className="w-16 h-16 bg-gradient-to-br from-orange-400 to-red-500 rounded-full flex items-center justify-center border-4 border-white shadow-lg animate-bounce-pet">
                            <CoffeeLogoIcon className="text-white w-8 h-8" />
                        </div>
                        <h1 className="text-3xl md:text-5xl font-cartoon text-orange-600 drop-shadow-sm" style={{ WebkitTextStroke: '1px white' }}>
                            Lingo-Pet Cafe!
                        </h1>
                    </div>
                    <div className="flex items-center gap-3 bg-gradient-to-b from-yellow-300 to-yellow-500 px-6 py-3 rounded-full border-4 border-white shadow-lg transform rotate-2">
                        <StarIcon className="text-white w-6 h-6 animate-spin-slow" />
                        <span className="text-3xl font-cartoon text-white drop-shadow-md">{score}</span>
                    </div>
                </header>
            );

            const renderIntro = () => (
                <div className="flex-1 flex flex-col items-center justify-center p-6 z-10 relative h-full">
                    <div className="bg-white p-8 rounded-[3rem] shadow-2xl border-[12px] border-orange-300 max-w-3xl w-full text-center animate-pop-in relative">
                        <div className="absolute -top-12 -right-12 text-7xl animate-float">🍩</div>
                        
                        <h2 className="text-5xl font-cartoon text-amber-800 mb-6 drop-shadow-sm">Welcome!</h2>
                        
                        <div className="relative w-full aspect-video bg-amber-100 rounded-3xl overflow-hidden mb-8 border-8 border-amber-200 shadow-inner group">
                            {/* HERE is where it looks for the local video in the same folder */}
                            
                            <video 
                                id="intro-video"
                                className="w-full h-full object-cover"
                                autoPlay
                                loop
                                muted={isMuted}
                                playsInline
                                src="./my-heygen-video.mp4"
                            />

                            <button
                                type="button"
                                onClick={() => setIsMuted(!isMuted)}
                                className="absolute top-4 right-4 z-30 bg-white/90 hover:bg-white text-orange-600 px-4 py-2 rounded-full font-bold shadow-lg cursor-pointer"
                            >
                                {isMuted ? '🔊 Tap to hear' : '🔇 Tap to Mute'}
                            </button>
                            
                            <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent flex flex-col justify-end p-6">
                                <span className="bg-orange-500 text-white px-4 py-2 rounded-full text-lg font-cartoon w-max shadow-lg mb-2 flex items-center gap-2">
                                    <VolumeIcon className="w-5 h-5"/> HeyGen Avatar Intro
                                </span>
                                <p className="text-white text-left font-bold text-2xl drop-shadow-md font-cartoon tracking-wide">
                                    "Hi! Welcome to my cafe! Tap the microphone and serve the pets!"
                                </p>
                            </div>
                        </div>

                        <button 
                            onClick={startGame}
                            className="bg-gradient-to-b from-green-400 to-green-600 hover:from-green-500 hover:to-green-700 text-white text-3xl font-cartoon py-4 px-16 rounded-full shadow-[0_8px_0_rgb(21,128,61)] hover:shadow-[0_4px_0_rgb(21,128,61)] hover:translate-y-1 active:shadow-[0_0px_0_rgb(21,128,61)] active:translate-y-2 transition-all flex items-center gap-4 mx-auto"
                        >
                            <PlayIcon className="w-8 h-8" /> START GAME
                        </button>
                    </div>
                </div>
            );

            const renderGameplay = () => (
                <div className="flex-1 flex flex-col justify-end p-4 z-10 relative h-full">
                    <div className="flex-1 flex flex-col items-center justify-end pb-12 relative w-full max-w-4xl mx-auto">
                        <div className="bg-white p-6 rounded-3xl rounded-br-none border-8 border-blue-300 shadow-xl mb-6 relative animate-pop-in flex flex-col items-center">
                            <div className="absolute -bottom-6 right-10 w-8 h-8 bg-white border-r-8 border-b-8 border-blue-300 transform rotate-45"></div>
                            <h3 className="text-2xl font-bold text-gray-500 mb-2 font-cartoon uppercase tracking-wider">I would like a...</h3>
                            <div className="flex items-center gap-4 text-5xl font-cartoon text-orange-600 uppercase">
                                {currentOrder.icon}
                                <span className="drop-shadow-sm">{currentOrder.name}!</span>
                            </div>
                        </div>

                        <div className="text-[12rem] leading-none drop-shadow-2xl animate-bounce-pet relative z-20">
                            {currentPet}
                        </div>
                    </div>

                    <div className="w-full bg-gradient-to-b from-amber-700 to-amber-900 rounded-t-[3rem] p-8 border-t-[16px] border-amber-600 shadow-[0_-10px_40px_rgba(0,0,0,0.2)] relative z-30 min-h-[250px] flex flex-col items-center justify-center">
                        <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'repeating-linear-gradient(90deg, transparent, transparent 40px, #000 40px, #000 42px)' }}></div>

                        <div className="relative z-10 flex flex-col items-center">
                            <button 
                                onClick={toggleListen}
                                className={`w-32 h-32 rounded-full flex items-center justify-center shadow-2xl transition-all duration-300 border-8 ${
                                    isListening 
                                    ? 'bg-red-500 border-white animate-pulse-mic' 
                                    : 'bg-blue-500 hover:bg-blue-400 border-white hover:scale-105 active:scale-95 shadow-[0_10px_0_rgb(29,78,216)] hover:shadow-[0_5px_0_rgb(29,78,216)] hover:translate-y-[5px] active:shadow-[0_0px_0_rgb(29,78,216)] active:translate-y-[10px]'
                                }`}
                            >
                                <MicIcon className="text-white w-16 h-16" />
                            </button>
                            
                            <div className="mt-8 bg-white/90 backdrop-blur rounded-2xl p-4 border-4 border-amber-300 min-w-[300px] text-center shadow-inner">
                                {spokenText ? (
                                    <span className="text-2xl font-bold text-amber-900 font-cartoon">{spokenText}</span>
                                ) : (
                                    <span className="text-xl text-amber-700/60 font-bold animate-pulse">
                                        {isListening ? "Listening..." : `Tap mic & say "Here is your ${currentOrder.name}"`}
                                    </span>
                                )}
                            </div>
                        </div>
                        
                        <div className="absolute top-0 left-[20%] text-white/40 animate-steam">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M19.9 8.7C19.4 6 18.2 4.1 16.5 2.5C16.1 2.1 15.5 2.1 15.1 2.5C14.7 2.9 14.7 3.5 15.1 3.9C16.4 5.2 17.4 6.8 17.9 9.1C18 9.6 18.5 9.9 19 9.8C19.5 9.7 19.8 9.2 19.9 8.7M14.9 11.2C14.4 8.5 13.2 6.6 11.5 5C11.1 4.6 10.5 4.6 10.1 5C9.7 5.4 9.7 6 10.1 6.4C11.4 7.7 12.4 9.3 12.9 11.6C13 12.1 13.5 12.4 14 12.3C14.5 12.2 14.8 11.7 14.9 11.2M9.9 13.7C9.4 11 8.2 9.1 6.5 7.5C6.1 7.1 5.5 7.1 5.1 7.5C4.7 7.9 4.7 8.5 5.1 8.9C6.4 10.2 7.4 11.8 7.9 14.1C8 14.6 8.5 14.9 9 14.8C9.5 14.7 9.8 14.2 9.9 13.7Z" /></svg>
                        </div>
                        <div className="absolute top-2 right-[20%] text-white/40 animate-steam-delayed">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M19.9 8.7C19.4 6 18.2 4.1 16.5 2.5C16.1 2.1 15.5 2.1 15.1 2.5C14.7 2.9 14.7 3.5 15.1 3.9C16.4 5.2 17.4 6.8 17.9 9.1C18 9.6 18.5 9.9 19 9.8C19.5 9.7 19.8 9.2 19.9 8.7M14.9 11.2C14.4 8.5 13.2 6.6 11.5 5C11.1 4.6 10.5 4.6 10.1 5C9.7 5.4 9.7 6 10.1 6.4C11.4 7.7 12.4 9.3 12.9 11.6C13 12.1 13.5 12.4 14 12.3C14.5 12.2 14.8 11.7 14.9 11.2M9.9 13.7C9.4 11 8.2 9.1 6.5 7.5C6.1 7.1 5.5 7.1 5.1 7.5C4.7 7.9 4.7 8.5 5.1 8.9C6.4 10.2 7.4 11.8 7.9 14.1C8 14.6 8.5 14.9 9 14.8C9.5 14.7 9.8 14.2 9.9 13.7Z" /></svg>
                        </div>
                    </div>
                </div>
            );

            const renderFeedback = () => {
                if (gameState !== 'success' && gameState !== 'failure') return null;

                const isSuccess = gameState === 'success';
                
                return (
                    <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
                        <div className={`transform transition-all animate-pop-in rounded-[3rem] p-12 text-center border-[16px] shadow-2xl relative overflow-hidden ${
                            isSuccess ? 'bg-green-100 border-green-400' : 'bg-red-100 border-red-400'
                        }`}>
                            {isSuccess ? (
                                <>
                                    <div className="absolute inset-0 pointer-events-none opacity-50 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MCIgaGVpZ2h0PSI1MCI+PGNpcmNsZSBjeD0iMjUiIGN5PSIyNSIgcj0iNSIgZmlsbD0iI2Y1OTU5NSIvPjwvc3ZnPg==')] animate-float"></div>
                                    <CheckCircleIcon className="w-40 h-40 text-green-500 mx-auto mb-6 animate-bounce-pet bg-white rounded-full p-2 shadow-lg" />
                                    <h2 className="text-6xl font-cartoon text-green-600 mb-4 drop-shadow-md">+10 Points!</h2>
                                    <p className="text-3xl text-green-800 font-bold font-cartoon bg-white/80 py-2 px-6 rounded-full inline-block">Yummy {currentOrder.name}!</p>
                                </>
                            ) : (
                                <>
                                    <XCircleIcon className="w-40 h-40 text-red-500 mx-auto mb-6 animate-pulse bg-white rounded-full p-2 shadow-lg" />
                                    <h2 className="text-6xl font-cartoon text-red-600 mb-4 drop-shadow-md">Oops!</h2>
                                    <p className="text-3xl text-red-800 font-bold font-cartoon bg-white/80 py-2 px-6 rounded-full inline-block">Say: "Here is your {currentOrder.name}"</p>
                                </>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="h-full w-full flex flex-col relative cafe-pattern">
                    <FloatingBeans />
                    {renderHeader()}
                    <main className="flex-1 flex flex-col relative overflow-y-auto" style={{ minHeight: 0 }}>
                        {gameState === 'intro' ? renderIntro() : renderGameplay()}
                        {renderFeedback()}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LingoPetCafe />);
    </script>
</body>
</html>
